schema: spec-driven

# Injected into all artifact instructions (proposal, specs, design, tasks).
context: |
  Capability-URL date poll (no logins - the link is the credential).
  SvelteKit 2 / Svelte 5 + Tailwind 4 on Cloudflare Workers + D1. Bun.

  Read before writing artifacts:
  - openspec/specs/PROJECT.md - product, security model, data model, routes,
    conventions (source of truth alongside the capability specs)
  - openspec/specs/DESIGN.md - look and feel: palette, type, icons, motion

  Repo invariants:
  - Specs are behavioral only - no function, file, or component names.
  - Every requirement has at least one GIVEN/WHEN/THEN scenario.
  - Each capability dir colocates its Playwright tests
    (openspec/specs/<capability>/*.spec.ts); one test per scenario, titles
    semantically traceable to scenario names.
  - UI strings are never hardcoded - messages/{da,de,en,es,fr}.json via
    Paraglide; tests assert m.*() values.

rules:
  specs:
    - Behavioral only - no implementation details, file names, or component names
    - Cover the failure/edge case, not just the happy path
